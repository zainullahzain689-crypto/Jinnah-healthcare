function lookup(){
 const ph=$('f_phone').value.trim();if(!ph)return;
 const p=S.patients.find(x=>x.phone===ph);
 if(p){$('f_name').value=p.name;$('f_age').value=p.age;$('f_gen').value=p.gender;toast('Existing patient found: '+p.mrn)}
}
function register(){
 const name=$('f_name').value.trim(),age=$('f_age').value,fee=+$('f_fee').value,phone=$('f_phone').value.trim();
 if(!name)return toast('Enter the patient name');
 if(age===''||+age<0)return toast('Enter a valid age');
 if(!(fee>=0)||$('f_fee').value==='')return toast('Enter the fee amount');
 let p=S.patients.find(x=>phone&&x.phone===phone&&x.name.toLowerCase()===name.toLowerCase());
 if(!p){p={mrn:'MRN-'+String(++S.mrn).padStart(4,'0'),name,age:+age,gender:$('f_gen').value,phone};S.patients.push(p)}
 else{p.age=+age;p.gender=$('f_gen').value}
 const v={id:uid(),token:'TK-'+(++S.tok),mrn:p.mrn,name:p.name,age:p.age,gender:p.gender,phone:p.phone,dept:$('f_dept').value,doctor:$('f_doc').value.trim()||'Duty Doctor',fee,method:$('f_pay').value,dt:new Date().toISOString(),status:'Waiting',by:me().name,vit:{},complaint:'',notes:'',diagnosis:'',rx:[]};
 S.visits.push(v);save();render();toast('Token '+v.token+' issued');printReceipt(v.id);
}

function rxAvail(n){n=String(n||'').trim();if(!n)return'';const s=findSt(n);return !s?'<span class="text-amber-700">Not in pharmacy stock list</span>':s.qty>0?'<span class="text-emerald-700">✓ Available · '+stTxt(s)+'</span>':'<span class="text-rose-700">✗ Out of stock</span>'}
function rxChk(i,v){const e=$('rxa_'+i);if(e)e.innerHTML=rxAvail(v)}
function rxSearch(t){const el=$('rxres');t=t.trim().toLowerCase();
 if(!S.stock.length){el.innerHTML='<p class="text-xs text-slate-500">Pharmacy stock list is empty.</p>';return}
 const L=S.stock.filter(s=>!t||s.name.toLowerCase().includes(t)).slice(0,10);
 el.innerHTML=L.map(s=>s.qty>0?`<button class="w-full flex justify-between gap-2 rounded-lg border border-slate-200 px-3 py-2 text-left text-sm hover:bg-teal-50" onclick="addRxMed('${s.id}')"><span>${esc(s.name)}</span><span class="text-xs text-emerald-700">✓ ${stTxt(s)}</span></button>`:`<div class="flex justify-between gap-2 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm"><span>${esc(s.name)}</span><span class="text-xs text-rose-700">✗ Out of stock</span></div>`).join('')||'<p class="text-xs text-slate-500">No matching medicine in pharmacy stock.</p>'}
function addRxMed(id){const s=S.stock.find(x=>x.id===id),v=gv(),e=v.rx.find(r=>!r.med);if(e)e.med=s.name;else v.rx.push(newRx(s.name));save();vDoc()}
function labCard(v){const l=labOf(v.id),sel=l?l.tests:[];return `<div class="card dcard"><div class="flex flex-wrap justify-between gap-1 mb-2"><h2 class="h !mb-0">🔬 Direct lab order</h2><span class="text-xs text-slate-500">${l?l.ref+' · '+(l.paid?chip(l.status):'<span class="chip bg-rose-100 text-rose-800">Awaiting payment at Lab Billing</span>')+' · '+money(l.fee):'No tests selected'}</span></div><p class="text-xs text-slate-500 mb-2">Ordered tests go to Lab Billing first. After the fee is received they appear in the Laboratory.</p><input id="d_s" class="inp !mt-0 mb-2" placeholder="Search test (e.g. CBC, thyroid, vitamin)" value="${esc(window._dq||'')}" oninput="fTests(this,'d_tl')"><div id="d_tl" class="grid sm:grid-cols-2 gap-x-4 max-h-80 overflow-y-auto">${Object.keys(T).map(k=>`<label style="${window._dq&&!T[k].n.toLowerCase().includes(window._dq.toLowerCase())?'display:none':''}" class="tl flex items-center gap-2 text-sm py-1"><input type="checkbox" class="w-5 h-5 accent-teal-700" ${sel.includes(k)?'checked':''} onchange="toggleTest('${k}',this.checked)"><span>${T[k].n} <span class="text-xs text-slate-500">${money(T[k].pr)}</span></span></label>`).join('')}</div></div>`}
function toggleTest(k,on){
 const v=gv();let l=labOf(v.id);
 if(!l){if(!on)return;l={id:uid(),ref:'LAB-'+(++S.ref),vid:v.id,tests:[],status:'Ordered',orderDt:new Date().toISOString(),fee:0,paid:false,results:{},config:{}};S.labs.push(l)}
 if(l.status!=='Ordered'){toast('Sample already collected; tests cannot be changed');return vDoc()}
 if(l.paid){toast('Fee already received; tests cannot be changed');return vDoc()}
 l.tests=on?[...new Set([...l.tests,k])]:l.tests.filter(x=>x!==k);
 if(!l.tests.length)S.labs=S.labs.filter(x=>x!==l);else l.fee=l.tests.reduce((s,x)=>s+T[x].pr,0);
 save();render();
}

/* ---------- LIS (Laboratory Module) ---------- */
function collectSample(id){
 const l=S.labs.find(x=>x.id===id);
 l.sampleDt=new Date().toISOString();l.status='Collected';l.cby=me().name;
 save();toast('Sample marked as collected');vLis();
}

function getTestParams(tKey, lObj){
 const base = T[tKey].p;
 const custom = (lObj.config && lObj.config[tKey] && lObj.config[tKey].custom) || [];
 const hidden = (lObj.config && lObj.config[tKey] && lObj.config[tKey].hidden) || [];
 const edited = (lObj.config && lObj.config[tKey] && lObj.config[tKey].edited) || {};
 const order = (lObj.config && lObj.config[tKey] && lObj.config[tKey].order) || null;
 
 let params = base.map(p => {
  if(p[0] === '_d') return p;
  const key = p[0];
  const e = edited[key] || {};
  return [key, e.n || p[1], e.u !== undefined ? e.u : p[2], e.r !== undefined ? e.r : p[3], p[4], e.r !== undefined ? undefined : p[5]];
 });
 params = params.concat(custom);
 params = params.filter(p => !hidden.includes(p[0]));

 if(order && Array.isArray(order)){
  params.sort((a,b) => {
   let ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
   if(ia===-1) ia = 999; if(ib===-1) ib = 999;
   return ia - ib;
  });
 }
 return params;
}

function moveParam(tKey, pKey, dir){
 if(lockedLab())return;
 const l=S.labs.find(a=>a.id===curL);
 if(!l.config) l.config = {};
 if(!l.config[tKey]) l.config[tKey] = { hidden: [], edited: {}, custom: [], order: [] };
 
 let params = getTestParams(tKey, l);
 let keys = params.map(x=>x[0]);
 let idx = keys.indexOf(pKey);
 if(idx===-1) return;
 
 let target = idx + dir;
 if(target < 0 || target >= keys.length) return;
 
 let temp = keys[idx];
 keys[idx] = keys[target];
 keys[target] = temp;
 
 l.config[tKey].order = keys;
 save();vLis();
}

function setRes(key,x){
 const l=S.labs.find(a=>a.id===curL),v=vOf(l.vid);
 if(l.status==='Verified')return toast('Report is verified and locked. Admin must unlock it');if(l.status==='Reported')l.editedBy=me().name;
 l.results[key]=x;save();
 const [t,k]=key.split('.'), pList = getTestParams(t, l), p=pList.find(a=>a[0]===k);
 if(p){
  const f=flag(p,v.gender,x),e=$('fl_'+t+'_'+k);
  if(e){
   e.textContent=FL[f]||(x===''?'':'Normal');
   e.className='chip '+(f?(f==='L'?'bg-amber-100 text-amber-800':'bg-rose-100 text-rose-700'):'text-emerald-700');
  }
 }
}

const lockedLab=()=>{const l=S.labs.find(a=>a.id===curL);if(l&&l.status==='Verified'){toast('Report is verified and locked. Admin must unlock it');return true}if(!can('params')){toast('You do not have permission to change test parameters');return true}return false};
function cfgOf(l,t){l.config=l.config||{};const c=l.config[t]=l.config[t]||{};c.hidden=c.hidden||[];c.edited=c.edited||{};c.custom=c.custom||[];return c}
function hiddenChips(t,l){const c=cfgOf(l,t);if(!c.hidden.length)return'';return`<div class="flex flex-wrap items-center gap-1 mb-2 text-xs text-slate-500">Hidden:${c.hidden.map(k=>{const b=T[t].p.find(x=>x[0]===k);return`<button class="chip bg-slate-100 text-slate-700 hover:bg-teal-100" onclick="showParam('${t}','${k}')">+ ${esc(b?(c.edited[k]&&c.edited[k].n)||b[1]:k)}</button>`}).join('')}</div>`}
function showParam(t,k){if(lockedLab())return;const l=S.labs.find(a=>a.id===curL),c=cfgOf(l,t);c.hidden=c.hidden.filter(x=>x!==k);save();vLis()}
function closeModal(){const m=$('modal');m.classList.add('hidden');m.innerHTML=''}
function editParamModal(tKey,pKey){
 if(lockedLab())return;
 const l=S.labs.find(a=>a.id===curL),isNew=!pKey,p=isNew?['','','','',null]:getTestParams(tKey,l).find(x=>x[0]===pKey);
 if(!p)return;
 const r=p[3],obj=!!r&&typeof r==='object'&&!Array.isArray(r),isC=!isNew&&pKey.startsWith('c_');
 const f=(id,lb,v,ph='')=>`<label class="lb">${lb}<input id="${id}" type="number" step="any" class="inp" value="${esc(v)}" placeholder="${ph}"></label>`;

 if(!can('verify'))return toast('You do not have permission to verify reports');
 const l=S.labs.find(x=>x.id===id);if(l.status!=='Reported')return toast('Submit the report first');
 if(!confirm('Verify this report? It will be locked and nobody can edit it until an admin unlocks it.'))return;

 if(me().role!=='Admin')return toast('Only an admin can unlock a verified report');

 (l.ulog=l.ulog||[]).push({by:me().name,dt:new Date().toISOString(),prev:l.vby});

function printDoc(html,size){
 $('pg').textContent=size==='r'?'@page{size:80mm auto;margin:3mm}':size==='pa'?'@page{size:A4;margin:0}':'@page{size:A4;margin:12mm}';
 const pa=$('printArea');
 pa.innerHTML=`<div class="noprint sticky top-0 z-10 flex items-center justify-between gap-2 bg-teal-900 px-3 py-2 text-white"><b class="text-sm">${size==='r'?'Thermal slip (80mm)':'A4 print preview'}</b><div class="flex gap-2"><button class="btn2" onclick="window.print()">Print</button><button class="btn2" onclick="closePv()">Close</button></div></div><div id="slip" class="${size}">${html}</div><p class="noprint text-center text-xs text-slate-600 pb-8 px-4">${size==='pa'?'In the print dialog set Paper size to A4. ':''}If Print does nothing, open this page in Chrome and print from there.</p>`;
 pa.style.setProperty('--z',Math.min(1,(innerWidth-16)/794));
 pa.classList.add('show');pa.scrollTop=0;
 pa.querySelectorAll('.qr').forEach(el=>{try{new QRCode(el,{text:el.dataset.t,width:+el.dataset.s||88,height:+el.dataset.s||88,correctLevel:QRCode.CorrectLevel.M})}catch(e){}});

const hdr=sub=>`<div class="text-center border-b-2 border-black pb-2 mb-3"><div class="flex items-center justify-center gap-2">${LOGO(38)}<div class="text-xl font-extrabold tracking-wide">${CLINIC.n}</div></div><div class="text-xs">${CLINIC.addr}<br>Ph: ${CLINIC.ph}</div>${sub?`<div class="font-bold mt-1">${sub}</div>`:''}</div>`;
const lhead=sub=>`<div style="display:flex;align-items:center;gap:14px;padding-bottom:7px"><div style="flex:none">${LOGO(62)}</div><div style="flex:1;min-width:0"><div style="font-size:25px;font-weight:800;letter-spacing:.04em;color:#0b4f6c;line-height:1.1">${esc(CLINIC.n)}</div>${CLINIC.tag?`<div style="font-size:11.5px;font-style:italic;font-weight:600;color:#15803d;margin-top:2px">${esc(CLINIC.tag)}</div>`:''}</div><div style="text-align:right;font-size:10.5px;line-height:1.55;color:#222;max-width:230px"><div>${esc(CLINIC.addr)}</div><div style="font-weight:700">Ph: ${esc(CLINIC.ph)}</div></div></div><div style="height:4px;border-radius:2px;background:linear-gradient(90deg,#1d4ed8,#0f766e 55%,#16a34a)"></div>${sub?`<div style="text-align:center;margin:7px 0 8px"><span style="display:inline-block;background:#0f766e;color:#fff;font-weight:700;letter-spacing:.16em;font-size:12px;padding:3px 18px;border-radius:999px">${sub}</span></div>`:''}`;
const rw=(a,b)=>`<div class="flex justify-between gap-3 py-0.5"><span>${a}</span><b class="text-right">${b}</b></div>`;

function printLab(id){
 const l=S.labs.find(x=>x.id===id);
 if(!l||l.status!=='Verified')return toast('The report can be printed only after it is verified');
 const v=vOf(l.vid),g=v.gender,ab=[];
 const BIG=.4,BIGROWS=10;
 /* 1. rows of every test */
 const tests=l.tests.map(t=>({t,rows:getTestParams(t,l).map(p=>{
  if(p[0]==='_d')return`<tr class="sub"><td colspan="3">${esc(p[1])}</td></tr>`;
  const x=l.results[t+'.'+p[0]],f=flag(p,g,x),has=x!==undefined&&x!=='';
  if(f)ab.push(p[1]+' '+x+(p[2]?' '+p[2]:'')+' ['+FL[f]+']');
  return`<tr class="${f?'ab':''}"><td>${esc(p[1])}</td><td>${has?esc(x)+(p[2]?' '+esc(p[2]):''):'—'}</td><td class="rf">${esc(rtxt(p))}</td></tr>`})}));
 const blk=(t,rows,contd)=>`<div class="blk"><div class="pn">${esc(T[t].n.toUpperCase())}${contd?' (contd.)':''}</div><table class="pt"><colgroup><col style="width:38%"><col style="width:30%"><col style="width:32%"></colgroup><thead><tr><th>Test</th><th>Result</th><th>Reference</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
 const sumHTML='';
 const head=`<div class="ph">${lhead('')}<div class="pband">CLINICAL PATHOLOGY LABORATORY</div></div><div class="pi">${[['Patient',esc(v.name)],['Age / Gender',v.age+' Y / '+g],['Ref No',l.ref],['OPD Ref',esc(v.token)],['Sample Date/Time',fdt(l.sampleDt)],['Report Date/Time',fdt(l.reportDt)]].concat(v.doctor&&v.doctor!=='Self'?[['Referring Doctor',esc(v.doctor)]]:[]).map(a=>`<div><span class="k">${a[0]}</span><b>${a[1]}</b></div>`).join('')}</div>`;
 const foot=(n,m)=>`<div class="pf"><div class="qr" data-s="56" data-t="ZMC|LAB|${l.ref}|${esc(v.token)}|${esc(v.name)}|${l.reportDt}"></div><div class="pl">Report time: ${fdt(l.vdt||l.reportDt)} · Computer-generated report.<br><i>${DISC}</i></div><div class="ps"><div class="sl"><b style="font-size:12px;color:#0b4f6c">${esc(l.path||S.set.path)}</b><div>${esc(l.title||S.set.title)}</div></div></div><div class="pn2">Page ${n} / ${m}</div></div><div class="pbar"></div>`;
 const page=(body,n,m)=>`<div class="pg"><img class="wm" src="${LOGO_B}" alt="">${head}<div class="pb">${body}</div>${foot(n,m)}</div>`;
 /* 2. measure on a hidden A4 page (same CSS as print) */
 const probe=document.createElement('div');probe.className='probe';document.body.appendChild(probe);
 probe.innerHTML=page('',1,1);const pb=probe.querySelector('.pb');
 const cap=pb.clientHeight-2;
 const mh=html=>{pb.innerHTML='<div>'+html+'</div>';return pb.firstChild.getBoundingClientRect().height};
 const sumH=sumHTML?mh(sumHTML):0;
 /* 3. blocks; a block taller than a page is split by rows */
 const items=[];
 tests.forEach(b=>{
  const h=mh(blk(b.t,b.rows,false));
  if(h<=cap){items.push({html:blk(b.t,b.rows,false),h,big:h>=cap*BIG||b.rows.filter(r=>!/class="sub"/.test(r)).length>=BIGROWS});return}
  let rows=b.rows.slice(),first=true;
  while(rows.length){
   let n=rows.length;while(n>1&&mh(blk(b.t,rows.slice(0,n),!first))>cap)n--;
   while(n>1&&/class="sub"/.test(rows[n-1]))n--;
   items.push({html:blk(b.t,rows.slice(0,n),!first),h:mh(blk(b.t,rows.slice(0,n),!first)),big:true});
   rows=rows.slice(n);first=false;
  }});
 /* 4. smart packing: big report = its own page, small reports fill pages */
 const pages=[];let sumOk=!!sumHTML;
 const np=()=>{const q={items:[],used:0,closed:false,cap:pages.length===0&&sumH?cap-sumH:cap};pages.push(q);return q};
 items.forEach((it,i)=>it.i=i);
 items.filter(x=>x.big).forEach(it=>{const q=np();if(pages.length===1&&it.h>q.cap){q.cap=cap;sumOk=false}q.items.push(it);q.used=it.h;q.closed=true});
 items.filter(x=>!x.big).sort((x,y)=>y.h-x.h).forEach(it=>{let q=pages.find(x=>!x.closed&&x.used+it.h<=x.cap);if(!q)q=np();q.items.push(it);q.used+=it.h});
 pages.forEach(q=>q.items.sort((x,y)=>x.i-y.i));
 if(!pages.length)np();
 if(sumOk)pages[0].items.unshift({html:sumHTML});
 probe.remove();
 const html=pages.map((q,i)=>page(q.items.map(x=>x.html).join(''),i+1,pages.length)).join('');
 printDoc(html,'pa');
}

function printRx(id){
 const v=vOf(id),t=v.vit||{},o=v.oe||{},l=labOf(id),doc=esc(v.cdoc||v.doctor);
 const uv=(x,u)=>{x=String(x||'').trim();return x?(/^[\d.\/\s]+$/.test(x)?esc(x)+' <small>'+u+'</small>':esc(x)):(u?'<small style="color:#6b7aa0">'+u+'</small>':'')};
 const pill=(h,sub)=>`<div class="rxpill">${h}</div>`;
 const OE=[['Pulse',uv(t.pulse,'/min')],['Bp',uv(t.bp,'mm Hg')],['Temp',uv(t.temp,'°F')],['Anaemia',esc(o.anaemia)],['Jaundice',esc(o.jaundice)],['Cyanosis',esc(o.cyanosis)],['Oedema',esc(o.oedema)],['Dehydration',esc(o.dehydration)],['Nails',esc(o.nails)],['Lymph node',esc(o.lymph)],['Resp',uv(t.resp,'/min')],['Heart',esc(o.heart)],['Lungs',esc(o.lungs)],['Abdomen',esc(o.abdomen)],['Nervous System',esc(o.nervous)],['MSK System',esc(o.msk)],['Others',esc(o.others)]];
 const oe=OE.map((r,i)=>`<div class="oer"><span class="n">${String(i+1).padStart(2,'0')}.</span><span class="l">${r[0]}</span><span class="v">${r[1]||''}</span>${r[0]==='Abdomen'?'<svg width="34" height="22" viewBox="0 0 34 22" style="position:absolute;right:6px;top:0"><rect x="1" y="1" width="32" height="20" rx="6" fill="none" stroke="#9fb0d6" stroke-width="1"/><path d="M12 1V21M22 1V21M1 8H33M1 14H33" stroke="#c3cee8" stroke-width=".8"/></svg>':''}</div>`).join('');

function parseLines(txt){
 const out=[];let i=0;
 for(const raw of txt.split('\n')){const ln=raw.trim();if(!ln)continue;
  if(ln[0]==='#'){out.push(['_d',ln.replace(/^#\s*/,'').toUpperCase()]);continue}
  const f=ln.split('|').map(x=>x.trim()),n=f[0],u=f[1]||'',r=f[2]||'';if(!n)continue;const k='p'+(++i);let m;
  if(m=r.match(/^M\s*([\d.]+)\s*-\s*([\d.]+)\s*[;,]\s*F\s*([\d.]+)\s*-\s*([\d.]+)$/i))out.push([k,n,u,{M:[+m[1],+m[2]],F:[+m[3],+m[4]]},null]);
  else if(m=r.match(/^([\d.]+)\s*-\s*([\d.]+)$/))out.push([k,n,u,[+m[1],+m[2]],null]);
  else if(r.includes('/')){const o=r.split('/').map(x=>x.trim()).filter(Boolean),nl=o.find(x=>x[0]==='*');out.push([k,n,u,nl?nl.slice(1):'',o.map(x=>x.replace(/^\*/,''))])}
  else out.push([k,n,u,r,null]);
 }
 return out;
}
function lineOf(p){if(p[0]==='_d')return'# '+p[1];const r=p[3];let f;
 if(p[4])f=p[4].map(o=>(o===r?'*':'')+o).join('/');
 else if(Array.isArray(r))f=r[0]+'-'+r[1];
 else if(r&&typeof r==='object')f='M '+r.M[0]+'-'+r.M[1]+'; F '+r.F[0]+'-'+r.F[1];
 else f=r||'';
 return p[1]+' | '+(p[2]||'')+' | '+f}
function saveTest(){
 const n=$('ct_n').value.trim(),pv=$('ct_pr').value,p=parseLines($('ct_p').value);
 if(!n)return toast('Enter test name');if(pv===''||!(+pv>=0))return toast('Enter test price');
 if(!p.some(x=>x[0]!=='_d'))return toast('Add at least one parameter');
 const k=ctEdit||'x_'+uid();
 if(ctEdit&&T[k]){const used=new Set();T[k].p.forEach(o=>{const m=p.find(x=>x[0]!=='_d'&&x[1]===o[1]&&!used.has(x));if(m&&o[0]!=='_d'){m[0]=o[0];used.add(m)}})}
 const t={n,pr:+pv,p,large:p.length>=4,custom:true};
 T[k]=t;S.ctests[k]=t;ctEdit=null;save();vCat();toast('Test saved: '+n);
}

/* ---------- Admin edit (corrections) ---------- */
let ed=null,edI=[];
const payS=(id,v)=>`<label class="lb">Payment<select id="${id}" class="inp">${['Cash','Card','Mobile wallet'].map(m=>`<option ${m===v?'selected':''}>${m}</option>`).join('')}</select></label>`;
function editLog(x,w){(x.edits=x.edits||[]).push({by:me().name,dt:new Date().toISOString(),w})}
function savePatient(mrn,name,age,gender,phone){
 const p=S.patients.find(x=>x.mrn===mrn);if(p){p.name=name;p.age=+age;p.gender=gender;p.phone=phone}
 [S.visits,S.svcs].forEach(a=>a.filter(v=>v.mrn===mrn).forEach(v=>{v.name=name;v.age=+age;v.gender=gender;v.phone=phone}));
 S.sales.filter(v=>v.mrn===mrn).forEach(v=>{v.name=name});
}
function edPat(m){const p=S.patients.find(x=>x.mrn===m)||{name:'',age:'',gender:'Male',phone:''};
 return`<div class="grid grid-cols-2 gap-3"><label class="lb col-span-2">Patient name<input id="e_n" class="inp" value="${esc(p.name)}"></label><label class="lb">Age (years)<input id="e_a" type="number" min="0" class="inp" value="${esc(p.age)}"></label><label class="lb">Gender<select id="e_g" class="inp">${['Male','Female','Other'].map(g=>`<option ${g===p.gender?'selected':''}>${g}</option>`).join('')}</select></label><label class="lb col-span-2">Phone<input id="e_p" class="inp" value="${esc(p.phone||'')}"></label></div>`}
function readPat(){const n=$('e_n').value.trim(),a=$('e_a').value;if(!n){toast('Enter patient name');return null}if(a===''||+a<0){toast('Enter a valid age');return null}return{n,a,g:$('e_g').value,p:$('e_p').value.trim()}}
function edModal(title,body){$('modal').innerHTML=`<div class="card w-full max-w-lg max-h-[90vh] overflow-y-auto"><div class="flex items-center justify-between mb-3"><h2 class="h !mb-0">${title}</h2><button class="btn2" onclick="closeModal()">✕</button></div>${body}<div class="flex gap-2 mt-4"><button class="btn" onclick="saveEd()">Save changes</button><button class="btn2 !py-2.5" onclick="closeModal()">Cancel</button></div><p class="text-[11px] text-slate-500 mt-2">Every edit is logged with your name and time.</p></div>`;$('modal').classList.remove('hidden')}
function editPatient(mrn){if(me().role!=='Admin')return toast('Only an admin can edit');ed={kind:'pat',mrn};edModal('Edit patient · '+mrn,edPat(mrn))}
function edRec(){return({opd:S.visits,svc:S.svcs,lab:S.labs,ph:S.sales})[ed.kind].find(a=>a.id===ed.id)}
function editRec(kind,id){
 if(me().role!=='Admin')return toast('Only an admin can edit entries');
 const x=({opd:S.visits,svc:S.svcs,lab:S.labs,ph:S.sales})[kind].find(a=>a.id===id);
 if(!x)return;if(x.void)return toast('Cancelled entries cannot be edited');
 ed={kind,id};
 if(kind==='opd'){
  const ds=Object.keys(DEPTS);if(!ds.includes(x.dept))ds.push(x.dept);
  edModal('Edit OPD entry · '+x.token,edPat(x.mrn)+`<div class="grid grid-cols-2 gap-3 mt-3"><label class="lb">Department<select id="e_d" class="inp">${ds.map(d=>`<option ${d===x.dept?'selected':''}>${esc(d)}</option>`).join('')}</select></label><label class="lb">Fee (PKR)<input id="e_f" type="number" min="0" class="inp" value="${x.fee}"></label><label class="lb col-span-2">Doctor<input id="e_doc" list="e_dl" class="inp" value="${esc(x.doctor)}"><datalist id="e_dl">${S.docs.map(d=>`<option value="${esc(d)}">`).join('')}</datalist></label>${payS('e_m',x.method)}</div>`);
 }else if(kind==='svc'){
  edModal('Edit service · '+x.no,edPat(x.mrn)+`<div class="grid grid-cols-2 gap-3 mt-3"><label class="lb col-span-2">Service name<input id="e_s" class="inp" value="${esc(x.svc)}"></label><label class="lb">Amount (PKR)<input id="e_f" type="number" min="0" class="inp" value="${x.amt}"></label>${payS('e_m',x.method)}</div>`);
 }else if(kind==='lab'){
  if(x.status==='Verified')return toast('Report is verified. Unlock it in the Laboratory first, then edit.');
  const v=vOf(x.vid)||{};
  edModal('Edit lab order · '+x.ref,edPat(v.mrn)+`<div class="grid grid-cols-2 gap-3 mt-3">${v.labOnly?`<label class="lb col-span-2">Referred by<input id="e_doc" list="e_dl" class="inp" value="${esc(v.doctor)}"><datalist id="e_dl">${S.docs.map(d=>`<option value="${esc(d)}">`).join('')}</datalist></label>`:''}${x.paid?payS('e_m',x.method||'Cash'):''}</div><div class="lb mt-3">Tests (current total ${money(x.fee)})</div><input class="inp !mt-1" placeholder="Search test" oninput="fTests(this,'e_tl')"><div id="e_tl" class="mt-2 max-h-56 overflow-y-auto rounded-lg border border-slate-200 p-2">${Object.keys(T).map(k=>`<label class="tl flex items-center gap-2 text-sm py-1"><input type="checkbox" class="et w-5 h-5 accent-teal-700" value="${k}" ${x.tests.includes(k)?'checked':''}><span>${esc(T[k].n)} <span class="text-xs text-slate-500">${money(T[k].pr)}</span></span></label>`).join('')}</div><p class="text-[11px] text-slate-500 mt-1">Removing a test deletes its entered results. Adding a test to a submitted report sends it back to the lab for results.</p>`);
 }else{
  edI=x.items.map(i=>({...i}));
  edModal('Edit pharmacy bill · '+x.no,(x.mrn?edPat(x.mrn):`<label class="lb">Customer name<input id="e_cn" class="inp" value="${esc(x.name)}"></label>`)+`<datalist id="e_sl">${S.stock.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist><div class="lb mt-3">Medicines</div><div id="e_items" class="mt-1"></div><button class="btn2 mt-1" onclick="edAdd()">+ Add item</button><div class="grid grid-cols-2 gap-3 mt-3">${payS('e_m',x.method)}<div class="lb">Total<div id="e_tot" class="font-bold text-base mt-2"></div></div></div><p class="text-[11px] text-slate-500 mt-1">Stock is adjusted automatically for the changes.</p>`);
  edRows();
 }
}
function edRows(){
 $('e_items').innerHTML=edI.map((c,i)=>`<div class="grid grid-cols-12 gap-2 mb-2"><input data-ac="stock" autocomplete="off" class="inp !mt-0 col-span-12 sm:col-span-5" placeholder="Medicine" value="${esc(c.name)}" onchange="edSet(${i},'name',this.value)"><select class="inp !mt-0 col-span-4 sm:col-span-2" onchange="edSet(${i},'unit',this.value)">${['Box','Strip','Piece'].map(u=>`<option ${u===c.unit?'selected':''}>${u}</option>`).join('')}</select><input type="number" min="1" class="inp !mt-0 col-span-3 sm:col-span-2" value="${c.qty}" onchange="edSet(${i},'qty',this.value)"><input type="number" min="0" class="inp !mt-0 col-span-4 sm:col-span-2" value="${c.price}" onchange="edSet(${i},'price',this.value)"><button class="btn2 col-span-1 !px-0" onclick="edDel(${i})">✕</button></div>`).join('')||'<p class="text-sm text-slate-500">No items.</p>';
 $('e_tot').textContent=money(edI.reduce((a,c)=>a+(+c.qty||0)*(+c.price||0),0));
}
function edSet(i,k,v){const c=edI[i];c[k]=(k==='name'||k==='unit')?v:+v;if(k==='name'||k==='unit'){const p=pr(c.name,c.unit);if(p)c.price=p}edRows()}
function edAdd(){edI.push({name:'',unit:'Strip',qty:1,price:0});edRows()}
function edDel(i){edI.splice(i,1);edRows()}
function saveEd(){
 if(me().role!=='Admin')return toast('Only an admin can edit');
 if(ed.kind==='pat'){const P=readPat();if(!P)return;savePatient(ed.mrn,P.n,P.a,P.g,P.p);save();closeModal();render();return toast('Patient updated everywhere')}
 const x=edRec(),k=ed.kind,P=(k==='ph'&&!x.mrn)?{}:readPat();if(!P)return;
 if(k==='opd'){
  const fee=$('e_f').value;if(fee===''||!(+fee>=0))return toast('Enter the fee');
  const was=`${x.name}, ${x.dept}, ${x.doctor}, fee ${x.fee}`;
  savePatient(x.mrn,P.n,P.a,P.g,P.p);x.dept=$('e_d').value;x.doctor=$('e_doc').value.trim()||'Duty Doctor';x.fee=+fee;x.method=$('e_m').value;
  if(x.doctor!=='Duty Doctor'&&!S.docs.some(d=>nd(d)===nd(x.doctor)))S.docs.push(normDoc(x.doctor));
  editLog(x,'OPD edited. Was: '+was);
 }else if(k==='svc'){
  const a=$('e_f').value,sn=$('e_s').value.trim();if(!sn)return toast('Enter service name');if(a===''||!(+a>0))return toast('Enter the amount');
  const was=`${x.name}, ${x.svc}, ${x.amt}`;
  savePatient(x.mrn,P.n,P.a,P.g,P.p);x.svc=sn;x.amt=+a;x.method=$('e_m').value;editLog(x,'Service edited. Was: '+was);
 }else if(k==='lab'){
  const ks=[...document.querySelectorAll('.et:checked')].map(e=>e.value);if(!ks.length)return toast('Select at least one test');
  const v=vOf(x.vid)||{},rem=x.tests.filter(t=>!ks.includes(t)),add=ks.filter(t=>!x.tests.includes(t)),was=x.tests.map(t=>T[t]?T[t].n:t).join(', ');
  savePatient(v.mrn,P.n,P.a,P.g,P.p);
  if(v.labOnly&&$('e_doc'))v.doctor=$('e_doc').value.trim()||'Self';
  if($('e_m')){x.method=$('e_m').value;if(v.labOnly)v.method=x.method}
  rem.forEach(t=>Object.keys(x.results).filter(r=>r.startsWith(t+'.')).forEach(r=>delete x.results[r]));
  if(rem.length||add.length){x.tests=ks;x.fee=ks.reduce((a,t)=>a+T[t].pr,0)}
  if(add.length&&x.status==='Reported'){x.status='Collected';x.vby=null;x.vdt=null}
  editLog(x,'Lab edited. Tests were: '+was);
 }else{
  const items=edI.filter(i=>i.name.trim()&&+i.qty>0);if(!items.length)return toast('Add at least one medicine');
  x.items.forEach(i=>{const s=findSt(i.name);if(s)s.qty+=i.qty*mult(s,i.unit)});
  const left={};let bad=null;
  for(const c of items){const s=findSt(c.name);if(s){left[s.id]=(left[s.id]??s.qty)-c.qty*mult(s,c.unit);if(left[s.id]<0){bad=s;break}}}
  if(bad){x.items.forEach(i=>{const s=findSt(i.name);if(s)s.qty-=i.qty*mult(s,i.unit)});return toast('Not enough '+bad.name+' in stock ('+stTxt(bad)+')')}
  items.forEach(c=>{const s=findSt(c.name);if(s)s.qty-=c.qty*mult(s,c.unit)});
  const was=x.items.map(i=>i.name+' x'+i.qty+' '+i.unit).join(', ')+' = '+x.total;
  x.items=items.map(c=>({name:c.name.trim(),unit:c.unit,qty:+c.qty,price:+c.price||0}));
  x.total=x.items.reduce((a,c)=>a+c.qty*c.price,0);x.method=$('e_m').value;
  if(x.mrn)savePatient(x.mrn,P.n,P.a,P.g,P.p);else x.name=$('e_cn').value.trim()||'Walk-in customer';
  editLog(x,'Pharmacy bill edited. Was: '+was);
 }
 save();closeModal();render();toast('Entry corrected and logged');
}

/* ---------- Cancel entries (admin only) ---------- */
function cancelRec(kind,id){
 if(me().role!=='Admin')return toast('Only an admin can cancel entries');
 const x=({opd:S.visits,svc:S.svcs,lab:S.labs,ph:S.sales})[kind].find(a=>a.id===id);
 if(!x||x.void)return;
 const r=prompt('Why is this entry being cancelled? (reason required)');if(r===null)return;
 if(!r.trim())return toast('Enter a reason to cancel');
 const vd={by:me().name,dt:new Date().toISOString(),reason:r.trim()};
 if(kind==='ph')x.items.forEach(i=>{const s=findSt(i.name);if(s)s.qty+=i.qty*mult(s,i.unit)});
 if(kind==='opd')S.labs.filter(l=>l.vid===x.id&&!l.paid&&!l.void).forEach(l=>l.void={...vd,reason:'OPD token cancelled'});
 x.void=vd;save();render();toast('Entry cancelled'+(kind==='ph'?' · stock restored':''));
}

/* ---------- Doctor-wise accounts ---------- */
function allDocs(){const m=new Map();[...S.docs,...S.visits.map(v=>v.doctor)].forEach(n=>{if(!n||n==='Self')return;const k=nd(n);if(k&&!m.has(k))m.set(k,n)});return[...m].map(([k,n])=>({k,n}))}
function docStats(d){
 const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0),
  vs=S.visits.filter(v=>!v.labOnly&&!v.void&&inR(v.dt)&&nd(v.doctor)===d.k),
  ls=S.labs.filter(l=>l.paid&&!l.void&&inR(l.orderDt)&&nd((vOf(l.vid)||{}).doctor)===d.k),
  ph=S.sales.filter(x=>x.vid&&!x.void&&inR(x.dt)&&nd((vOf(x.vid)||{}).doctor)===d.k),
  opd=sum(vs,v=>v.fee),pct=+((S.dshare||{})[d.k])||0;
 return{vs,ls,ph,opd,lab:sum(ls,l=>l.fee),pha:sum(ph,x=>x.total),pct,share:Math.round(opd*pct/100),pts:new Set(vs.map(v=>v.mrn)).size};
}
function setShare(k,x){if(!S.dshare)S.dshare={};S.dshare[k]=Math.max(0,Math.min(100,+x||0));save();recBody()}
function pickDr(k){drSel=k;recBody()}

  <h3 class="text-sm font-semibold text-teal-900 mb-1">Pharmacy bills from his prescriptions</h3><div class="overflow-x-auto"><table class="w-full min-w-[420px]"><thead><tr><th>Date</th><th>Bill</th><th>Patient</th><th>Total</th></tr></thead><tbody class="divide-y divide-slate-100">${st.ph.slice().reverse().map(x=>`<tr><td>${fdt(x.dt)}</td><td>${x.no}</td><td>${esc(x.name)}</td><td>${money(x.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="text-slate-500 py-4">No pharmacy bills in this period.</td></tr>'}</tbody></table></div></section>`}
 $('recbody').innerHTML=`<div class="space-y-5"><section class="card"><h2 class="h">Doctor-wise accounts</h2><div class="overflow-x-auto"><table class="w-full min-w-[680px]"><thead><tr><th>Doctor</th><th>Patients</th><th>OPD fees</th><th>Share %</th><th>Doctor share</th><th>Lab referred</th><th>Pharmacy (Rx)</th><th></th></tr></thead><tbody class="divide-y divide-slate-100">${D.map(d=>`<tr class="${d.k===drSel?'bg-teal-50':''}"><td class="font-medium">${esc(d.n)}</td><td>${d.st.pts}</td><td>${money(d.st.opd)}</td><td><input type="number" min="0" max="100" class="inp !mt-0 !w-20 !py-1" value="${d.st.pct}" onchange="setShare('${d.k}',this.value)"></td><td>${money(d.st.share)}</td><td>${money(d.st.lab)}</td><td>${money(d.st.pha)}</td><td><button class="btn2" onclick="pickDr('${d.k}')">View</button></td></tr>`).join('')||'<tr><td colspan="8" class="text-slate-500 py-4">No doctors yet. Add doctors from the Tests & Doctors tab.</td></tr>'}</tbody>${D.length?`<tfoot><tr class="font-semibold border-t border-slate-300"><td>Total</td><td></td><td>${money(sm(s=>s.opd))}</td><td></td><td>${money(sm(s=>s.share))}</td><td>${money(sm(s=>s.lab))}</td><td>${money(sm(s=>s.pha))}</td><td></td></tr></tfoot>`:''}</table></div><p class="text-xs text-slate-500 mt-2">Period follows the date filter above. Share % is the doctor's cut of OPD fees; set it per doctor.</p></section>${det}</div>`;

function applyBrand(){const n=S.clinic&&S.clinic.name||'Jinnah Health Care';if($('hn'))$('hn').textContent=n;if($('ha'))$('ha').textContent=CLINIC.addr+' · '+CLINIC.ph;document.title=n+' – Clinic Management'}
function dayTot(d){const same=x=>x&&new Date(x).toDateString()===d.toDateString(),sm=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
 const o=sm(S.visits.filter(v=>!v.void&&!v.labOnly&&same(v.dt)),v=>v.fee),l=sm(S.labs.filter(x=>x.paid&&!x.void&&same(x.orderDt)),x=>x.fee),
  sv=sm(S.svcs.filter(x=>!x.void&&same(x.dt)),x=>x.amt),p=sm(S.sales.filter(x=>!x.void&&same(x.dt)),x=>x.total);
 return{o,l,s:sv,p,t:o+l+sv+p}}
function vDash(){
 const td=dayTot(new Date()),vs=S.visits.filter(v=>isToday(v.dt)&&!v.void&&!v.labOnly),

 <div class="grid lg:grid-cols-3 gap-5"><section class="card lg:col-span-2"><h2 class="h">Last 7 days · total collection</h2><div class="flex items-end gap-2 sm:gap-3 h-44">${days.map(x=>`<div class="flex-1 flex flex-col items-center justify-end h-full"><div class="text-[10px] text-slate-500 mb-1">${x.t?Math.round(x.t/1000)+'k':''}</div><div style="height:${Math.max(3,x.t/mx*100)}%;background:linear-gradient(180deg,#14b8a6,#0f766e)" class="w-full rounded-t-lg"></div><div class="text-[11px] mt-1 ${x.d.toDateString()===new Date().toDateString()?'font-bold text-teal-800':'text-slate-500'}">${x.d.toLocaleDateString('en-GB',{weekday:'short'})}</div></div>`).join('')}</div></section>
 <section class="card"><h2 class="h">Needs attention</h2><div class="space-y-2 text-sm">${[['Patients waiting',waiting,'opd'],['Lab fee pending',PEND(),'labdesk'],['Samples to collect',sample,'lis','new'],['Reports to verify',toVer,'lis','rep']].map(a=>`<button class="w-full flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 hover:bg-teal-50" onclick="${a[3]?`lisF='${a[3]}';`:''}go('${a[2]}')"><span>${a[0]}</span><span class="chip ${a[1]?'bg-amber-100 text-amber-800':'bg-emerald-100 text-emerald-800'}">${a[1]}</span></button>`).join('')}</div></section></div>
 <div class="grid lg:grid-cols-2 gap-5"><section class="card"><h2 class="h">Doctors today</h2><table class="w-full"><thead><tr><th>Doctor</th><th>Patients</th><th>OPD fees</th></tr></thead><tbody class="divide-y divide-slate-100">${Object.entries(byDoc).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.f)}</td></tr>`).join('')||'<tr><td colspan="3" class="text-slate-500 py-3">No patients yet today.</td></tr>'}</tbody></table></section>

}
function saveClinic(){const n=$('set_n').value.trim(),a=$('set_a').value.trim(),p=$('set_p').value.trim();if(!n)return toast('Enter the clinic name');
 const tg=$('set_t').value.trim();S.clinic={name:n,addr:a,ph:p,tag:tg};CLINIC.n=n.toUpperCase();CLINIC.addr=a;CLINIC.ph=p;CLINIC.tag=tg;S.set.path=$('set_path').value.trim()||S.set.path;S.set.title=$('set_title').value.trim()||S.set.title;save();applyBrand();toast('Clinic details saved')}
function dlBackup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='clinic-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();S.lastBackup=new Date().toISOString();save();toast('Backup downloaded');vSet()}
function rsBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.visits)||!Array.isArray(o.staff))throw 0;if(!confirm('Replace ALL current data with this backup? This cannot be undone.'))return;localStorage.setItem(KEY,JSON.stringify(o));localStorage.setItem('cloud_dirty','1');location.reload()}catch(e){toast('This is not a valid backup file')}};r.readAsText(f)}
function resetAll(){const t=prompt('This will delete ALL clinic data from this browser. Type DELETE to confirm.');if(t!=='DELETE')return toast('Cancelled, nothing deleted');localStorage.removeItem(KEY);location.reload()}
function vSet(){
 const c=S.clinic||{name:'Jinnah Health Care',addr:CLINIC.addr,ph:CLINIC.ph};
 $('main').innerHTML=`<div class="grid lg:grid-cols-2 gap-5 fade"><section class="card self-start"><h2 class="h">Clinic details</h2><p class="text-xs text-slate-500 -mt-2 mb-3">Printed on every receipt, prescription and report.</p><div class="space-y-3"><label class="lb">Clinic name<input id="set_n" class="inp" value="${esc(c.name)}"></label><label class="lb">Address<input id="set_a" class="inp" value="${esc(c.addr)}"></label><label class="lb">Phone number(s)<input id="set_p" class="inp" value="${esc(c.ph)}"></label><label class="lb">Tagline (printed under the name)<input id="set_t" class="inp" value="${esc(c.tag!==undefined?c.tag:CLINIC.tag)}"></label><label class="lb">Pathologist name (on lab reports)<input id="set_path" class="inp" value="${esc(S.set.path)}"></label><label class="lb">Pathologist title<input id="set_title" class="inp" value="${esc(S.set.title)}"></label></div><button class="btn mt-4" onclick="saveClinic()">Save details</button></section>
 <section class="card self-start"><h2 class="h">Backup & restore</h2><p class="text-sm text-slate-600 mb-3">All data is stored in <b>this browser only</b>. Clearing browser data or changing computer will lose it, so download a backup regularly (at least weekly) and keep it safe.</p><div class="text-xs text-slate-500 mb-3">Last backup: <b>${S.lastBackup?fdt(S.lastBackup):'never'}</b></div><div class="flex flex-wrap gap-3"><button class="btn" onclick="dlBackup()">⬇ Download backup</button><label class="btn2 !py-2.5 cursor-pointer">⬆ Restore from backup<input type="file" accept=".json,application/json" class="hidden" onchange="rsBackup(this)"></label></div><div class="mt-6 rounded-xl border border-rose-200 bg-rose-50 p-3"><div class="text-sm font-semibold text-rose-800">Danger zone</div><p class="text-xs text-rose-700 my-1">Deletes every patient, bill, report and stock record from this browser.</p><button class="btn2 !text-rose-700" onclick="resetAll()">Erase all data</button></div></section><section class="card self-start lg:col-span-2"><h2 class="h">☁ Cloud sync (Firebase)</h2><p class="text-sm text-slate-600 mb-3">Your data is automatically saved to the cloud a moment after every change and shared between all computers that sign in. Updating the app file will not delete it.</p><div class="flex flex-wrap items-center gap-3"><span class="chip bg-slate-100 text-slate-700">${esc(({ok:'Synced',syncing:'Syncing…',dirty:'Saving…',err:'Offline, will retry',out:'Not signed in',nomod:'Local only',loading:'Connecting…'})[(window.cloudState||{}).s]||'—')}</span><button class="btn" onclick="cloudModal()">Open cloud sync</button></div></section></div>`}
let lastAct=Date.now();['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{if(S.sess&&Date.now()-lastAct>20*60*1000){signout();toast('Signed out after 20 minutes of inactivity')}},30000);

/* ---------- Cloud sync (Firebase) : browser side ---------- */
function cloudApply(o,rr){const keep={sess:S.sess,lastBackup:S.lastBackup};try{localStorage.setItem(KEY,JSON.stringify({...o,...keep}))}catch(e){}S=load();postLoad();if(rr!==false){try{render()}catch(e){}}}
window.cloudApply=cloudApply;window.cloudGet=()=>S;window.cloudPersist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function cloudChip(){const c=window.cloudState||{s:'loading'},b=$('cloudBtn');if(!b)return;
 const m={loading:'☁ Connecting…',nomod:'☁ Local only',out:'☁ Sign in',dirty:'☁ Saving…',syncing:'☁ Syncing…',ok:'☁ Synced',err:'☁ Offline, will retry'};
 b.textContent=m[c.s]||'☁';b.style.background=c.s==='out'||c.s==='err'?'#fbbf24':c.s==='ok'?'#dcfce7':'#fff';b.style.color=c.s==='out'||c.s==='err'?'#1e293b':c.s==='ok'?'#166534':'#374151';b.style.border='1px solid '+(c.s==='ok'?'#bbf7d0':'#e5e7eb')}
setTimeout(()=>{if(!window.cloudState){window.cloudState={s:'nomod'};cloudChip()}},9000);
function cloudModal(){const c=window.cloudState||{s:'loading'},u=c.user;
 $('modal').innerHTML=`<div class="card w-full max-w-sm"><div class="flex items-center justify-between mb-2"><h2 class="h !mb-0">☁ Cloud sync</h2><button class="btn2" onclick="closeModal()">✕</button></div><p class="text-xs text-slate-500 mb-3">All clinic data is saved in your secure Firebase database, so updating the app never loses data.</p>${!window.CLOUD?'<div class="rounded-lg bg-amber-50 border border-amber-300 p-3 text-sm text-amber-900">Cloud is not available right now (no internet, or the file is opened from the computer instead of the website). The app keeps working and saves on this computer.</div>':u?`<div class="text-sm mb-3">Signed in as <b>${esc(u)}</b><br><span class="text-xs text-slate-500">Status: ${c.s==='ok'?'All data synced':c.s==='syncing'||c.s==='dirty'?'Syncing…':c.s==='err'?'Offline or error. Will retry. '+esc(c.msg||''):esc(c.s)}</span></div><div class="flex gap-2"><button class="btn" onclick="cloudSyncNow()">Sync now</button><button class="btn2" onclick="cloudSignOut()">Sign out</button></div>`:`<label class="lb">Cloud email<input id="cl_e" type="email" class="inp" autocomplete="username"></label><label class="lb mt-3">Cloud password<input id="cl_p" type="password" class="inp" autocomplete="current-password" onkeydown="if(event.key==='Enter')cloudSignIn()"></label><div id="cl_m" class="text-xs text-rose-700 mt-2"></div><button class="btn mt-3" onclick="cloudSignIn()">Sign in</button>`}</div>`;
 $('modal').classList.remove('hidden')}
async function cloudSignIn(){const e=$('cl_e').value.trim(),p=$('cl_p').value,m=$('cl_m');if(!e||!p){m.textContent='Enter the cloud email and password';return}
 m.style.color='#475569';m.textContent='Signing in…';
 try{await window.CLOUD.signIn(e,p)}catch(x){m.style.color='#be123c';const c=String(x&&x.code||'');m.textContent=/invalid|wrong|user-not-found/.test(c)?'Wrong email or password':/network/.test(c)?'No internet connection':/operation-not-supported|unauthorized-domain/.test(c)?'Open the app from its website address (GitHub Pages), not as a local file':'Could not sign in: '+c}}
async function cloudSyncNow(){try{toast('Syncing…');await window.CLOUD.syncNow();closeModal()}catch(x){toast('Sync failed')}}
async function cloudSignOut(){if(!confirm('Sign out of cloud sync on this computer? Data stays saved here and in the cloud.'))return;await window.CLOUD.signOut();closeModal()}

 const k=e.key;if(k!=='ArrowDown'&&k!=='ArrowUp'&&k!=='Enter')return;
 const el=e.target;if(!el||!/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)||el.type==='radio'||el.type==='file'||el.type==='button'||el.type==='submit')return;
 if(!el.closest('#main,#modal'))return;
 const items=(!ACD.classList.contains('hidden')&&acEl===el)?[...ACD.querySelectorAll('.ac-i')]:[];
 if(items.length){
  if(k!=='Enter'){e.preventDefault();acI=(acI+(k==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle('on',i===acI));items[acI].scrollIntoView({block:'nearest'});return}
  if(acI>=0){e.preventDefault();el.value=items[acI].dataset.v;acPick=true;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));acPick=false;acHide();navMove(el,1);return}
 }
 if(el.tagName==='SELECT'){if(k==='Enter'){e.preventDefault();navMove(el,1)}return}
 if(el.tagName==='TEXTAREA'){
  if(k==='ArrowDown'&&el.selectionStart===el.value.length&&el.selectionEnd===el.value.length){if(navMove(el,1))e.preventDefault()}
  else if(k==='ArrowUp'&&el.selectionStart===0&&el.selectionEnd===0){if(navMove(el,-1))e.preventDefault()}
  return}
 if(k==='Enter'){if(el.closest('table')&&navMove(el,1))e.preventDefault();return}
 e.preventDefault();acHide();navMove(el,k==='ArrowDown'?1:-1);
});

/* ---------- Stock purchase (many medicines, one supplier) ---------- */
let pu={s:'',p:'',i:''},pl=[];
const plNew=()=>({name:'',qty:'',unit:'Box',spb:'',pps:'',pBox:'',pStrip:'',pPc:''});
function plAdd(){pl.push(plNew());plRows();const e=$('pl'+(pl.length-1)+'_n');if(e)e.focus()}
function plDel(i){pl.splice(i,1);if(!pl.length)pl.push(plNew());plRows()}
function plSet(i,k,v){pl[i][k]=v}
function plName(i){
 const l=pl[i],v=l.name.trim().toLowerCase(),st=findSt(l.name),m=st||MEDS.find(x=>x.n.toLowerCase()===v);
 const put=(k,id,val)=>{if(!l[k]&&val){l[k]=String(+(+val).toFixed(2));const e=$('pl'+i+'_'+id);if(e)e.value=l[k]}};
 if(m){put('spb','spb',m.spb);put('pps','pps',m.pps)}
 if(st){put('pBox','pb',st.pBox);put('pStrip','ps',st.pStrip);put('pPc','pp',st.pPc)}
 const n=$('pl'+i+'_h');if(n)n.textContent=!v?'':st?'In stock: '+stTxt(st)+'. Pack size and prices filled.':m?'Pack size filled. Enter prices.':'New medicine. Enter pack size and a price.';
}
function plRows(){const b=$('pl_rows');if(!b)return;if(!pl.length)pl.push(plNew());
 const inp=(i,k,id,ph,w)=>`<label class="lb ${w}"><span class="font-normal">${ph[0]}</span><input id="pl${i}_${id}" type="number" min="0" step="any" class="inp !mt-0.5" placeholder="${ph[1]}" value="${esc(pl[i][k])}" oninput="plSet(${i},'${k}',this.value)"></label>`;
 b.innerHTML=pl.map((l,i)=>`<div class="rounded-lg border border-slate-200 bg-slate-50/50 p-3 mb-2"><div class="grid grid-cols-12 gap-2 items-end"><label class="lb col-span-12 sm:col-span-6"><span class="font-normal">${i+1}. Medicine</span><input id="pl${i}_n" data-ac="all" autocomplete="off" class="inp !mt-0.5" placeholder="Search or type medicine name" value="${esc(l.name)}" oninput="plSet(${i},'name',this.value)" onchange="plName(${i})"></label>${inp(i,'qty','q',['Quantity','10'],'col-span-5 sm:col-span-2')}<label class="lb col-span-5 sm:col-span-3"><span class="font-normal">Unit</span><select class="inp !mt-0.5" onchange="plSet(${i},'unit',this.value)">${['Box','Strip','Piece'].map(u=>`<option ${u===l.unit?'selected':''}>${u}</option>`).join('')}</select></label><button class="btn2 col-span-2 sm:col-span-1 !px-0 !py-2.5" aria-label="Remove" onclick="plDel(${i})">✕</button></div><div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mt-2">${inp(i,'spb','spb',['Strips per box','10'],'')}${inp(i,'pps','pps',['Pieces per strip','10'],'')}${inp(i,'pBox','pb',['Box price','500'],'')}${inp(i,'pStrip','ps',['Strip price','50'],'')}${inp(i,'pPc','pp',['Piece price','5'],'')}</div><div id="pl${i}_h" class="text-xs text-teal-700 mt-1"></div></div>`).join('');
 pl.forEach((l,i)=>{if(l.name)plName(i)})}
function plCalc(l){
 const n=l.name.trim(),s0=findSt(n),qt=+l.qty,u=l.unit;
 if(!n)return{err:'enter the medicine name'};if(!(qt>0))return{err:'enter the quantity'};
 const spb=+l.spb||(s0&&s0.spb)||1,pps=+l.pps||(s0&&s0.pps)||1;let bx=+l.pBox,st=+l.pStrip,pc=+l.pPc;
 if(!bx&&!st&&!pc&&s0){bx=s0.pBox;st=s0.pStrip;pc=s0.pPc}
 if(!pc&&st)pc=st/pps;if(!st&&bx)st=bx/spb;if(!st&&pc)st=pc*pps;if(!bx&&st)bx=st*spb;if(!pc&&st)pc=st/pps;
 if(!(pc>0))return{err:'enter at least one price (box, strip or piece)'};
 return{n,qt,u,spb,pps,bx,st,pc}}
function savePurchase(){
 const sup=pu.s.trim(),lines=pl.filter(l=>l.name.trim()||l.qty);
 if(!sup)return toast('Enter the supplier name');
 if(!lines.length)return toast('Add at least one medicine');
 const R=[];for(let i=0;i<lines.length;i++){const r=plCalc(lines[i]);if(r.err)return toast((lines[i].name.trim()||'Medicine '+(i+1))+': '+r.err);R.push(r)}
 R.forEach(r=>{let s=findSt(r.n);if(!s){s={id:uid(),name:r.n,qty:0};S.stock.push(s)}
  Object.assign(s,{spb:r.spb,pps:r.pps,pBox:r.bx,pStrip:r.st,pPc:r.pc,price:r.pc});s.qty+=r.qt*mult(s,r.u)});
 const ph=pu.p.trim();let sp=S.sups.find(x=>x.name.toLowerCase()===sup.toLowerCase());
 if(!sp){sp={name:sup,phone:ph};S.sups.push(sp)}else if(ph)sp.phone=ph;
 const rec={id:uid(),no:'PU-'+(++S.pun),supplier:sup,phone:ph||sp.phone||'',inv:pu.i.trim(),dt:new Date().toISOString(),by:me().name,lines:R.map(r=>({name:r.n,qty:r.qt,unit:r.u,price:r.bx}))};
 S.purch.push(rec);pu={s:'',p:'',i:''};pl=[plNew()];save();vPharm();toast(R.length+' medicine(s) added to stock from '+sup)}
function supFill(){const sp=S.sups.find(x=>x.name.toLowerCase()===pu.s.trim().toLowerCase());if(sp&&sp.phone&&!pu.p){pu.p=sp.phone;const e=$('pu_p');if(e)e.value=sp.phone}}

const mult=(s,u)=>u==='Box'?s.spb*s.pps:u==='Strip'?s.pps:1;
const uPrice=(s,u)=>u==='Box'?s.pBox:u==='Strip'?s.pStrip:s.pPc;
const pr=(n,u)=>{const s=findSt(n);return s?uPrice(s,u):0};
const stTxt=s=>{if(s.spb<=1&&s.pps<=1)return s.qty+' pcs';const bs=s.spb*s.pps,r=s.qty%bs;return Math.floor(s.qty/bs)+' box · '+Math.floor(r/s.pps)+' strip · '+(r%s.pps)+' pcs'};

let cart=[],phV=null,phPay='Cash';
function pickPh(id){phV=id;cart=vOf(id).rx.filter(r=>r.med).map(r=>({name:r.med,unit:'Strip',qty:1,price:pr(r.med,'Strip')}));vPharm()}
function walkin(){phV=null;cart=[{name:'',unit:'Strip',qty:1,price:0}];vPharm()}
function cartAdd(){cart.push({name:'',unit:'Strip',qty:1,price:0});vPharm()}
function cartDel(i){cart.splice(i,1);vPharm()}
function cartSet(i,k,x){const c=cart[i];c[k]=(k==='name'||k==='unit')?x:+x;if(k==='name'||k==='unit'){const p=pr(c.name,c.unit);if(p)c.price=p}vPharm()}

function addStock(){
 const n=$('s_n').value.trim(),s0=findSt(n),qt=+$('s_q').value,u=$('s_u').value;
 const spb=+$('s_spb').value||(s0&&s0.spb)||1,pps=+$('s_pps').value||(s0&&s0.pps)||1;
 let bx=+$('s_pb').value,st=+$('s_ps').value,pc=+$('s_pp').value;
 if(!n||!(qt>0))return toast('Enter medicine name and quantity');
 if(!bx&&!st&&!pc&&s0){bx=s0.pBox;st=s0.pStrip;pc=s0.pPc}
 if(!pc&&st)pc=st/pps;if(!st&&bx)st=bx/spb;if(!st&&pc)st=pc*pps;if(!bx&&st)bx=st*spb;if(!pc&&st)pc=st/pps;
 if(!(pc>0))return toast('Enter at least one price (box, strip or piece)');
 let s=s0;if(!s){s={id:uid(),name:n,qty:0};S.stock.push(s)}
 Object.assign(s,{spb,pps,pBox:bx,pStrip:st,pPc:pc,price:pc});s.qty+=qt*mult(s,u);save();toast('Stock updated');vPharm();
}
function delStock(id){S.stock=S.stock.filter(s=>s.id!==id);save();vPharm()}

function dispense(){
 const items=cart.filter(c=>c.name.trim()&&c.qty>0);
 if(!items.length)return toast('Add at least one medicine');
 const left={};
 for(const c of items){const s=findSt(c.name);if(s){left[s.id]=(left[s.id]??s.qty)-c.qty*mult(s,c.unit);if(left[s.id]<0)return toast('Not enough '+s.name+' in stock ('+stTxt(s)+')')}}
 items.forEach(c=>{const s=findSt(c.name);if(s)s.qty-=c.qty*mult(s,c.unit)});
 const v=phV?vOf(phV):null;
 const sale={id:uid(),no:'PH-'+(++S.pno),vid:phV,mrn:v?v.mrn:null,name:v?v.name:'Walk-in customer',items:items.map(c=>({name:c.name.trim(),unit:c.unit,qty:c.qty,price:c.price})),total:items.reduce((a,c)=>a+c.qty*c.price,0),method:phPay,dt:new Date().toISOString(),by:me().name};
 S.sales.push(sale);if(v)v.disp=true;save();cart=[];phV=null;vPharm();toast('Bill '+sale.no+' created');printPharm(sale.id);
}

function vPharm(){
 const list=S.visits.filter(v=>isToday(v.dt)&&v.rx.length&&!v.void).slice().reverse();
 const tot=cart.reduce((a,c)=>a+(+c.qty||0)*(+c.price||0),0);
 $('main').innerHTML=`<datalist id="dl">${S.stock.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist><datalist id="dlm">${[...new Set([...S.stock.map(s=>s.name),...MEDS.map(m=>m.n)])].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <div class="grid lg:grid-cols-4 gap-5"><section class="card lg:col-span-1 self-start"><h2 class="h">Prescriptions today</h2><button class="btn2 w-full mb-3" onclick="walkin()">+ Walk-in sale</button><div class="space-y-2 max-h-[50vh] overflow-y-auto">${list.map(x=>`<button onclick="pickPh('${x.id}')" class="w-full text-left rounded-lg border px-3 py-2 ${x.id===phV?'border-teal-600 bg-teal-50':'border-slate-200 hover:bg-slate-50'}"><div class="flex justify-between"><b class="text-sm text-teal-800">${x.token}</b><span class="chip ${x.disp?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}">${x.disp?'Dispensed':'To dispense'}</span></div><div class="text-sm">${esc(x.name)}</div><div class="text-xs text-slate-500">${x.rx.length} medicine(s)</div></button>`).join('')||'<p class="text-sm text-slate-500">No prescriptions yet today.</p>'}</div></section>
 <section class="card lg:col-span-3"><h2 class="h">Dispense${phV?' · '+esc(vOf(phV).name):''}</h2>${cart.map((c,i)=>{const s=findSt(c.name);return`<div class="grid grid-cols-12 gap-2 mb-3 items-center"><input data-ac="stock" autocomplete="off" class="inp !mt-0 col-span-12 sm:col-span-4" placeholder="Medicine" value="${esc(c.name)}" onchange="cartSet(${i},'name',this.value)"><select class="inp !mt-0 col-span-4 sm:col-span-2" onchange="cartSet(${i},'unit',this.value)">${['Box','Strip','Piece'].map(u=>`<option ${u===c.unit?'selected':''}>${u}</option>`).join('')}</select><input type="number" min="1" class="inp !mt-0 col-span-3 sm:col-span-2" value="${c.qty}" onchange="cartSet(${i},'qty',this.value)"><input type="number" min="0" class="inp !mt-0 col-span-4 sm:col-span-3" placeholder="Price" value="${c.price}" onchange="cartSet(${i},'price',this.value)"><button class="btn2 col-span-1 !px-0" aria-label="Remove" onclick="cartDel(${i})">✕</button><div class="col-span-12 text-xs text-slate-500 -mt-1">${s?stTxt(s)+' in stock':'Not in stock list'}</div></div>`}).join('')||'<p class="text-sm text-slate-500">Select a prescription or start a walk-in sale.</p>'}
 <div class="flex flex-wrap items-center justify-between gap-3 mt-3"><button class="btn2" onclick="cartAdd()">+ Add item</button><div class="flex items-center gap-3"><select class="inp !mt-0 !w-auto" onchange="phPay=this.value">${PAYS.map(m=>`<option ${m===phPay?'selected':''}>${m}</option>`).join('')}</select><b>${money(tot)}</b></div></div><button class="btn w-full mt-4" onclick="dispense()">Dispense & print bill</button></section>
 <section class="card lg:col-span-4"><h2 class="h">Stock purchase / restock</h2><p class="text-xs text-slate-500 -mt-2 mb-3">One supplier, any number of medicines. Type a medicine name to see suggestions (your stock first, then ${MEDS.length} built-in medicines).</p><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3"><label class="lb col-span-2">Supplier name<input id="pu_s" data-ac="sup" autocomplete="off" class="inp" placeholder="Search or type supplier" value="${esc(pu.s)}" oninput="puSet('s',this.value)" onchange="supFill()"></label><label class="lb">Supplier phone<input id="pu_p" inputmode="tel" class="inp" placeholder="03xx-xxxxxxx" value="${esc(pu.p)}" oninput="puSet('p',this.value)"></label><label class="lb">Invoice / bill no.<input id="pu_i" class="inp" placeholder="optional" value="${esc(pu.i)}" oninput="puSet('i',this.value)"></label></div><div id="pl_rows"></div><div class="flex flex-wrap gap-2 mt-2"><button class="btn2" onclick="plAdd()">+ Add another medicine</button><button class="btn" onclick="savePurchase()">Save purchase & add to stock</button></div>${S.purch.length?`<h3 class="text-sm font-semibold text-teal-900 mt-5 mb-1">Recent purchases</h3><div class="overflow-x-auto"><table class="w-full min-w-[520px]"><thead><tr><th>Date</th><th>No</th><th>Supplier</th><th>Invoice</th><th>Medicines</th></tr></thead><tbody class="divide-y divide-slate-100">${S.purch.slice(-10).reverse().map(p=>`<tr><td>${fdt(p.dt)}</td><td class="font-semibold text-teal-800">${p.no}</td><td>${esc(p.supplier)}<div class="text-xs text-slate-500">${esc(p.phone||'')}</div></td><td>${esc(p.inv||'—')}</td><td class="text-xs">${esc(p.lines.map(x=>x.name+' × '+x.qty+' '+x.unit.toLowerCase()).join(', '))}</td></tr>`).join('')}</tbody></table></div>`:''}</section>
 <section class="card lg:col-span-4"><h2 class="h">Inventory</h2>
 <div class="overflow-x-auto"><table class="w-full min-w-[520px]"><thead><tr><th>Medicine</th><th>Box</th><th>Strip</th><th>Piece</th><th>In stock</th><th></th></tr></thead><tbody class="divide-y divide-slate-100">${S.stock.map(s=>`<tr><td>${esc(s.name)}<div class="text-xs text-slate-500">${s.spb} strips/box · ${s.pps} pcs/strip</div></td><td>${money(s.pBox)}</td><td>${money(s.pStrip)}</td><td>${money(s.pPc)}</td><td>${stTxt(s)} ${s.qty<=10*s.pps?'<span class="chip bg-rose-100 text-rose-800">Low</span>':''}</td><td><button class="btn2" onclick="delStock('${s.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="6" class="text-slate-500 py-4">No stock yet. Add a medicine with box, strip and piece prices.</td></tr>'}</tbody></table></div></section></div>`;
 plRows();
}
function printPharm(id){if((S.sales.find(x=>x.id===id)||{}).void)return toast('This entry is cancelled');
 const s=S.sales.find(x=>x.id===id);
 printDoc(`<div style="width:72mm;margin:0 auto;font-size:12px;color:#000">${hdr('PHARMACY BILL')}${rw('Bill No',s.no)}${rw('Customer',esc(s.name))}${rw('Date',fdt(s.dt))}<div class="border-t border-dashed border-black my-2"></div>${s.items.map(i=>`<div class="flex justify-between gap-2"><span>${esc(i.name)} × ${i.qty} ${(i.unit||'pc').toLowerCase()}</span><b>${(i.qty*i.price).toLocaleString('en-US')}</b></div>`).join('')}<div class="border-t border-dashed border-black my-2"></div><div class="flex justify-between text-base font-bold"><span>Total</span><span>${money(s.total)}</span></div>${rw('Paid by',s.method)}${rw('Dispensed by',esc(s.by))}<div class="flex justify-center my-2"><div class="qr" data-s="90" data-t="ZMC|PHARMACY|${s.no}|${s.total}|${s.dt}"></div></div><div class="text-center text-[11px]">Scan to verify bill.</div></div>`,'r');
}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,onSnapshot,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAN0fO_2BMcnVPqslS7LqJnnbwR1FGT0IU",
  authDomain: "jinnah-health-care.firebaseapp.com",
  projectId: "jinnah-health-care",
  storageBucket: "jinnah-health-care.firebasestorage.app",
  messagingSenderId: "723260552476",
  appId: "1:723260552476:web:00de25e98ae117066e36d9",
  measurementId: "G-8RV2NCWQ9H"
};
const app = initializeApp(firebaseConfig);
import("https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js").then(m=>{try{m.getAnalytics(app)}catch(e){}}).catch(()=>{});
const auth=getAuth(app),db=getFirestore(app),META=doc(db,'clinic','meta');

/* ---- state helpers ---- */
const st=(s,msg)=>{window.cloudState={s,msg,user:auth.currentUser&&auth.currentUser.email};if(window.cloudChip)cloudChip()};
const getBase=()=>+localStorage.getItem('cloud_base')||0,setBase=n=>localStorage.setItem('cloud_base',String(n));
const isDirty=()=>localStorage.getItem('cloud_dirty')==='1',setDirty=v=>{if(v)localStorage.setItem('cloud_dirty','1');else localStorage.removeItem('cloud_dirty')};
const clean=o=>{const c={...o};delete c.sess;delete c.lastBackup;return c};
const keyOf=x=>x&&typeof x==='object'?(x.id!==undefined?'i'+x.id:x.mrn!==undefined?'m'+x.mrn:x.name!==undefined?'n'+x.name:JSON.stringify(x)):'p'+x;
const hasLocal=()=>{const S=window.cloudGet();return ['visits','labs','svcs','sales','stock','patients'].some(k=>(S[k]||[]).length>0)};

/* merge two copies of the data: union of records by id, newest edit wins */
function merge(L,R){
  const out={...R};
  for(const k of Object.keys(L)){
    if(k==='sess'||k==='lastBackup')continue;
    const a=L[k],b=R[k];
    if(b===undefined){out[k]=a;continue}
    if(Array.isArray(a)&&Array.isArray(b)){
      const m=new Map();b.forEach(x=>m.set(keyOf(x),x));
      a.forEach(x=>{const kk=keyOf(x),y=m.get(kk);if(y===undefined||(x&&typeof x==='object'&&(x._u||0)>=((y&&y._u)||0)))m.set(kk,x)});
      out[k]=[...m.values()];
    }else if(typeof a==='number'&&typeof b==='number')out[k]=Math.max(a,b);
    else if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b))out[k]={...b,...a};
    else out[k]=a;
  }
  return out;
}
/* stamp records that changed since the last sync so merges know which copy is newer */
const snap=new Map();
function walk(S,fn){for(const k of Object.keys(S)){const a=S[k];if(!Array.isArray(a))continue;for(const x of a){if(x&&typeof x==='object')fn(k,x)}}}
const sig=x=>{const {_u,...r}=x;return JSON.stringify(r)};
function primeSnap(){snap.clear();walk(window.cloudGet(),(k,x)=>snap.set(k+'|'+keyOf(x),sig(x)))}
function stamp(){let n=0;walk(window.cloudGet(),(k,x)=>{const id=k+'|'+keyOf(x),j=sig(x);if(snap.get(id)!==j){x._u=Date.now();snap.set(id,j);n++}});if(n)window.cloudPersist()}

async function readRemote(m){
  const parts=await Promise.all(Array.from({length:m.n},(_,i)=>getDoc(doc(db,'clinic_parts',m.rev+'_'+(m.nonce||'')+'_'+i))));
  return JSON.parse(parts.map(p=>{if(!p.exists())throw new Error('cloud data is being updated, retrying');return p.data().d}).join(''));
}
const idle=()=>{const a=document.activeElement,t=a&&a.tagName;return !(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')&&$('modal').classList.contains('hidden')&&!$('printArea').classList.contains('show')};
async function whenIdle(){for(let i=0;i<120&&!idle();i++)await new Promise(r=>setTimeout(r,1500))}

/* ---- push local data to the cloud ---- */
let pushing=false,pulling=false,again=false,timer=null,seq=0;
function queue(){if(!auth.currentUser)return;seq++;clearTimeout(timer);timer=setTimeout(push,1500);st('dirty')}
async function push(){
  if(!auth.currentUser)return;
  if(pushing||pulling){again=true;return}
  pushing=true;st('syncing');
  try{
    for(let attempt=0;attempt<6;attempt++){
      const ms=await getDoc(META),m=ms.exists()?ms.data():{rev:0,n:0};
      if(m.rev>0&&m.rev!==getBase()){const R=await readRemote(m);window.cloudApply(merge(window.cloudGet(),R),false);setBase(m.rev);primeSnap()}
      stamp();
      const mySeq=seq,data=JSON.stringify(clean(window.cloudGet())),parts=[];
      for(let i=0;i<data.length;i+=700000)parts.push(data.slice(i,i+700000));
      if(!parts.length)parts.push('{}');
      const rev=m.rev+1,nonce=Math.random().toString(36).slice(2,10),pid=i=>doc(db,'clinic_parts',rev+'_'+nonce+'_'+i);
      await Promise.all(parts.map((d,i)=>setDoc(pid(i),{d})));
      try{
        await runTransaction(db,async tx=>{const s=await tx.get(META),cur=s.exists()?s.data().rev:0;if(cur!==m.rev)throw new Error('conflict');tx.set(META,{rev,n:parts.length,nonce,at:serverTimestamp(),by:auth.currentUser.email||'',size:data.length})});
      }catch(e){parts.forEach((_,i)=>deleteDoc(pid(i)).catch(()=>{}));if(String(e&&e.message).includes('conflict'))continue;throw e}
      setBase(rev);if(seq===mySeq)setDirty(false);
      for(let i=0;i<(m.n||0);i++)deleteDoc(doc(db,'clinic_parts',m.rev+'_'+(m.nonce||'')+'_'+i)).catch(()=>{});
      st('ok');break;
    }
  }catch(e){console.error(e);st('err',String(e&&e.message||e));clearTimeout(timer);timer=setTimeout(push,30000)}
  pushing=false;if(again){again=false;queue()}
}
/* ---- bring newer cloud data to this computer ---- */
async function pull(m){
  if(pulling||pushing)return;pulling=true;st('syncing');
  try{
    const R=await readRemote(m);await whenIdle();
    if(isDirty()){window.cloudApply(merge(window.cloudGet(),R),true);setBase(m.rev);primeSnap();pulling=false;queue();return}
    window.cloudApply(R,true);setBase(m.rev);setDirty(false);primeSnap();st('ok');
  }catch(e){console.error(e);st('err',String(e&&e.message||e))}
  pulling=false;
}
async function check(){
  if(!auth.currentUser||pushing||pulling)return;
  try{const ms=await getDoc(META),m=ms.exists()?ms.data():{rev:0};
    if(m.rev>getBase()){if(isDirty())queue();else await pull(m)}else if(isDirty())queue();else st('ok');
  }catch(e){st('err',String(e&&e.message||e))}
}
let listening=false;
async function start(){
  st('syncing');
  try{
    const ms=await getDoc(META);
    if(!ms.exists()){setDirty(true);primeSnap();await push()}
    else{
      const m=ms.data();
      if(getBase()===0||m.rev!==getBase()){
        const R=await readRemote(m);
        if(hasLocal()&&(getBase()===0||isDirty())){window.cloudApply(merge(window.cloudGet(),R),true);setBase(m.rev);setDirty(true);primeSnap();await push()}
        else{window.cloudApply(R,true);setBase(m.rev);setDirty(false);primeSnap();st('ok')}
      }else{primeSnap();if(isDirty())await push();else st('ok')}
    }
  }catch(e){console.error(e);st('err',String(e&&e.message||e))}
  if(!listening){listening=true;
    onSnapshot(META,s=>{if(s.exists()&&s.data().rev>getBase()&&!pushing&&!pulling)check()},()=>{});
    setInterval(check,45000);
    addEventListener('online',check);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  }
}
window.cloudQueue=queue;
window.CLOUD={
  signIn:async(e,p)=>{await signInWithEmailAndPassword(auth,e,p)},
  signOut:async()=>{await signOut(auth);st('out')},
  syncNow:async()=>{if(auth.currentUser)await start()}
};
let asked=false;
onAuthStateChanged(auth,u=>{
  if(!u){st('out');if(!asked){asked=true;setTimeout(()=>{if(window.cloudModal&&!window.cloudState.user)cloudModal()},600)}return}
  if($('modal')&&document.getElementById('cl_e'))closeModal();
  start();
});
</script>
